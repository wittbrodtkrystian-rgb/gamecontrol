# LOKALNE Ĺ›rodowisko testowe Pterodactyl Panel (bez Wings). Tylko do developmentu â€” nie na produkcjÄ™.
# Panel: http://localhost:8080
services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes: ["ptero_db:/var/lib/mysql"]
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${PTERO_DB_PASSWORD:-ptero-local-pass}
      MYSQL_ROOT_PASSWORD: ${PTERO_DB_ROOT_PASSWORD:-ptero-local-root}
  cache:
    image: redis:7-alpine
    restart: unless-stopped
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    depends_on: [database, cache]
    ports: ["8080:80"]
    volumes: ["ptero_var:/app/var/", "ptero_nginx:/etc/nginx/http.d/", "ptero_logs:/app/storage/logs", "./mariadb-client-nossl.cnf:/etc/my.cnf.d/zz-nossl.cnf:ro"]
    environment:
      APP_URL: "http://localhost:8080"
      APP_TIMEZONE: "Europe/Warsaw"
      APP_SERVICE_AUTHOR: "dev@localhost"
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      DB_HOST: database
      DB_PORT: "3306"
      DB_PASSWORD: ${PTERO_DB_PASSWORD:-ptero-local-pass}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
volumes: { ptero_db: {}, ptero_var: {}, ptero_nginx: {}, ptero_logs: {} }
